name: Sync public release notes
on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: public-release-notes
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_releases.py --refresh
      - run: python scripts/sync_releases.py --check
      - run: python scripts/check_public.py
      - run: python scripts/check_pages.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - name: Commit refreshed website and request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'Sync published release notes and website version'
          git push origin main
          gh api --method POST repos/dajor/c9n/pages/builds
